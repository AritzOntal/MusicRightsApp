plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.svalero.musicrightsapp'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.svalero.musicrightsapp"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // PARA CONECTAR CON MI API JAVA SPRING
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation libs.recyclerview
    implementation libs.fragment// Para convertir JSON a Objetos Java

    // ROOM PARA BASES DE DATOS LOCAL
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version" // Importante para Java

    // GSON PARA MANEJAR JSON MANUALMENTE
    implementation 'com.google.code.gson:gson:2.10.1'

    // GLIDE PARA CARGAR IMÁGENES
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    //LOMBOCK
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}